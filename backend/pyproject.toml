[project]
name = "rvi-backend"
version = "0.1.0"
description = "Beta backend for Indian Railways visual inspection (findings, evidence, quality gate, model-assisted review)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "onnxruntime>=1.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
