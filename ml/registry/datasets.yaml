# Dataset registry mapped to Phase 1 focus areas (D02 IDs) and conditional variables.
# licence_use: production = usable for a deployed model; research = benchmark/feasibility only.
datasets:
  - {name: "Multi-class defects in railway tracks v2", host: "data.mendeley.com/datasets/88sh5y3tmj/2", media: images, size: "7,585 images, 10 classes", origin: "North Western Railway, India", licence: "CC BY 4.0", licence_use: production, focus: [PW-FS, PW-JT, PW-SL, PW-RL], used_in_ci: true}
  - {name: "RFD railway fastener defects (railwaytrack_fastener_defcts1)", host: "universe.roboflow.com/objectdetectiondeeplearning/railwaytrack_fastener_defcts1", media: images, size: "2,234 (augmented), 6 classes", origin: China, licence: "CC BY 4.0", licence_use: production, focus: [PW-FS-001, PW-FS-002, PW-BF-011], used_in_ci: false, note: "needs free Roboflow API key"}
  - {name: "Intelligent Railway Track Fasteners Defect Detection", host: "github.com/lonlonago/...", media: images, size: "1,876, 4 classes (fastener, fastener_missing, fishplate_crack, fishplate_normal)", licence: "not stated; paid", licence_use: "avoid", focus: [PW-FS-001, PW-JT-003]}
  - {name: "Rail-5k", host: "arXiv 2106.14366", media: images, size: "1,100 labelled + ~4k unlabelled, 13 classes", origin: China (inspection car, top-down), licence: "CC BY-NC-ND 4.0", licence_use: research, focus: [PW-RL-002, PW-RL-003, PW-RL-004, PW-RL-005]}
  - {name: "RSDDs", host: "ieee-dataport.org/documents/rsdds", media: images, size: "195 grayscale, 2 types", licence: "per IEEE DataPort", licence_use: research, focus: [PW-RL-002]}
  - {name: "RailSem19", host: "wilddash.cc/railsem19", media: "images (ego-view frames)", size: "8,500 frames (paper)", licence: "CC BY-NC 4.0 images; no redistribution", licence_use: research, focus: [scene segmentation, PW-BF-008, PW-BF-009], conditions: [day, night, rain, snow, tunnels]}
  - {name: "OSDaR23", host: "data.fid-move.de/dataset/osdar23", media: "multi-sensor sequences (RGB, IR, lidar, radar)", size: "45 sequences, 204,091 annotations, 20 classes", licence: "check portal", licence_use: research, focus: [PW-BF-009, obstruction], conditions: [IR night]}
  - {name: "RailFOD23", host: "Scientific Data 2024 (PMC10791632)", media: images, focus: [EL-OH-003 foreign objects on catenary], licence: "check", licence_use: research}
  - {name: "CPLID insulators", host: "ieee-dataport.org (Chinese Power Line Insulator Dataset)", media: "UAV images; defects synthetic", licence: "not stated", licence_use: research, focus: [EL-OH-001]}
  - {name: "dacl10k", host: "WACV 2024", media: images, size: "9,920 images, 18 classes", origin: "Germany, 100+ bridges", licence: "CC BY-NC 4.0", licence_use: research, focus: [BR-SB-001, BR-SB-002, BR-SB-003, BR-BG-001, BR-SS-001]}
  - {name: "CODEBRIM", media: images, size: "7,729 patches, 30 bridges", licence: "check", licence_use: research, focus: [BR-SB-002, BR-SS-001]}
  - {name: "CrackSeg9k", media: images, size: "9,255", licence: "check per sub-dataset", licence_use: research, focus: [PW-SL-001, BR-SB-001]}
  - {name: "SDNET2018", media: images, licence: "CC BY 4.0 (reported)", licence_use: production, focus: [BR-SB-001]}
  - {name: "ACDC adverse conditions", host: "acdc.vision.ee.ethz.ch", media: images, size: "8,012 (fog, night, rain, snow)", licence: "check", licence_use: research, conditions: [fog, night, rain, snow], focus: [robustness]}
  - {name: "FLEURS hi_in / en_us", host: "hf: google/fleurs", media: "speech audio", licence: "CC BY 4.0", licence_use: production, focus: [F08, F10], used_in_ci: true}
  - {name: "IndicVoices", host: "ai4bharat.iitm.ac.in/indicvoices", media: "speech audio (phones, noisy, extempore)", size: "7,348 h total; 16,237 speakers; 145 districts", licence: "CC BY 4.0", licence_use: production, focus: [F08], conditions: [field noise, accents]}
  - {name: "ESC-50 (train, rain, wind, engine, bells)", host: "github.com/karolpiczak/ESC-50", media: "environmental audio", licence: "CC BY-NC 3.0", licence_use: research, focus: [F08 noise robustness], used_in_ci: true}
  - {name: "MUSAN noise", host: "openslr.org/17", media: audio, licence: "CC BY 4.0 (mostly)", licence_use: production, focus: [F08 augmentation]}
  - {name: "PILOT – IR foot-patrol capture (to be collected)", media: "images, short video, voice commands", licence: "Indian Railways owned", licence_use: production, focus: [all Beta classes], conditions: [day, night-torch, rain, dust, glare, multiple zones], note: "Only source for USFD paint marks, km posts, eye-level handheld viewpoint"}
