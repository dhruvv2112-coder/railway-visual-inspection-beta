# OHE asset registry, numbering grammar, routing and rule registry (HLD §1.1 I-03, §2.3, §5, §8.3).
# FIXTURE: a fictional 1 km section used for tests and demos. Replace with the authorised registry; every
# rule carries authority, document, revision and decision type so nothing is applied without provenance.
version: "fixture-2026-10-31"
section: {id: "SEC-DEMO-01", division: "DEMO", depot: "OHE-DEMO", tracks: [UP, DN]}
numbering_grammar: '^\d{3,4}/\d{1,2}[A-Z]?$'   # km/mast e.g. 1205/14 – configure per railway
max_observation_m: 60                             # plausible distance from phone to target (corridor)
assets:
  - {id: "1205/10", type: mast, track: UP, lat: 26.91200, lon: 75.78700, design: "cantilever-single"}
  - {id: "1205/11", type: mast, track: DN, lat: 26.91204, lon: 75.78712, design: "cantilever-single"}
  - {id: "1205/12", type: mast, track: UP, lat: 26.91260, lon: 75.78760, design: "cantilever-single"}
  - {id: "1205/13", type: mast, track: DN, lat: 26.91264, lon: 75.78772, design: "cantilever-single"}
  - {id: "1205/14", type: mast, track: UP, lat: 26.91320, lon: 75.78820, design: "cantilever-single"}
  - {id: "1205/15", type: mast, track: DN, lat: 26.91324, lon: 75.78832, design: "cantilever-single"}
# component classes the detector may emit -> inspection scope; 'supported' = a validated condition path exists
components:
  insulator: {scope: "Insulators", supported_conditions: [insulator_visible_damage]}
  insulator_defect: {scope: "Insulators", symptom_of: insulator}
  bird_nest: {scope: "Vegetation, nests and loose material", supported_conditions: [foreign_object], presence_is_condition: true}
  foreign_object: {scope: "Vegetation, nests and loose material", supported_conditions: [foreign_object], presence_is_condition: true}
  vegetation: {scope: "Vegetation, nests and loose material", supported_conditions: [vegetation_near_ohe], presence_is_condition: true}
  dropper: {scope: "Droppers", supported_conditions: []}
  number_plate: {scope: "Number plates and painted identifiers", supported_conditions: []}
  # detected for evidence and identity; no condition is claimed until validated on railway OHE images (HLD §15.1)
  mast: {scope: "Masts and structures", supported_conditions: [mast_lean], lean_check: true}
  corrosion: {scope: "Masts and structures", supported_conditions: [visible_corrosion], presence_is_condition: true}
  # whole-photo inventory (open-vocabulary scene model): out-of-place articles found anywhere in the photo
  scene_foreign_object: {scope: "Vegetation, nests and loose material", supported_conditions: [scene_foreign_object], presence_is_condition: true}
  loose_stone: {scope: "Track and surroundings", supported_conditions: [loose_stone], presence_is_condition: true}
  scrap_metal: {scope: "Track and surroundings", supported_conditions: [scrap_metal], presence_is_condition: true}
  animal_near_track: {scope: "Track and surroundings", supported_conditions: [animal_near_track], presence_is_condition: true}
  branch_near_ohe: {scope: "Vegetation, nests and loose material", supported_conditions: [branch_near_ohe], presence_is_condition: true}
  creeper_on_structure: {scope: "Vegetation, nests and loose material", supported_conditions: [creeper_on_structure], presence_is_condition: true}
  fire_or_smoke: {scope: "Track and surroundings", supported_conditions: [fire_or_smoke], presence_is_condition: true}
  waterlogging: {scope: "Track and surroundings", supported_conditions: [waterlogging], presence_is_condition: true}
  # mast lean is measured geometrically on the mast box (pipeline.mast_lean), corrected for the phone roll at capture
min_target_px: 48          # minimum short side of a component crop before condition is assessable (§2.2; tune empirically)
rules:
  - id: R-INS-01
    authority: "RDSO TI/MI/0060 (2022) 6.1(4)(a); CAMTECH OHE Inspection §7(b)"
    decision_type: visual_screening
    condition: insulator_visible_damage
    observed: "Surface damage compatible with a chipped or broken insulator shed is visible in the marked region"
    hypothesis: "Insulator surface damage"
    action_family: competent_closer_inspection
    action: "Arrange competent confirmation / maintenance assessment under the applicable instructions"
    limitations: "Internal condition and dielectric health are not assessed"
    priority: urgent
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-NEST-01
    authority: "RDSO TI/MI/0060 (2022) 6.1(4)(h); CAMTECH OHE Inspection §7(p)"
    decision_type: visual_screening
    condition: foreign_object
    observed: "A nest or foreign object is visible on or near the OHE in the marked region"
    hypothesis: "Possible foreign object infringing the OHE"
    action_family: urgent_control_assessment
    action: "Assess for removal under the applicable instructions; image overlap does not prove contact"
    limitations: "2D overlap is not physical contact or clearance"
    priority: urgent
    route: {primary: "OHE coordinator", contributors: ["Works / vegetation owner"]}
  - id: R-ANOM-01
    authority: "HLD §8.4 (unsupported design or unfamiliar anomaly)"
    decision_type: administrative_workflow
    condition: anomaly
    observed: "Appearance differs from the normal reference bank in the marked region"
    hypothesis: "Unclassified visual anomaly"
    action_family: competent_closer_inspection
    action: "Exception review; closer visual or technical assessment"
    limitations: "Anomaly score is not a defect diagnosis"
    priority: review
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-VEG-01
    authority: "HLD §7 visual screening (clause reference to be confirmed by TRD before field use)"
    decision_type: visual_screening
    condition: vegetation_near_ohe
    observed: "Vegetation is visible near the OHE in the marked region"
    hypothesis: "Possible vegetation encroachment towards live equipment"
    action_family: planned_maintenance
    action: "Check clearance on site and plan trimming with the vegetation owner if needed"
    limitations: "2D image overlap does not measure electrical clearance"
    priority: routine
    route: {primary: "OHE coordinator", contributors: ["Works / vegetation owner"]}
  - id: R-COR-01
    authority: "HLD §7 visual screening (clause reference to be confirmed by TRD before field use)"
    decision_type: visual_screening
    condition: visible_corrosion
    observed: "Surface rust is visible on the structure or fitting in the marked region"
    hypothesis: "Corrosion of mast, structure or fitting"
    action_family: planned_maintenance
    action: "Record for the next maintenance block; competent assessment of section loss if heavy"
    limitations: "Surface appearance only; section loss and strength are not assessed"
    priority: routine
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-LEAN-01
    authority: "HLD §7 visual screening (tolerance to be confirmed by TRD before field use)"
    decision_type: visual_screening
    condition: mast_lean
    observed: "The mast axis in the photo leans beyond the configured screening angle after correcting for phone tilt"
    hypothesis: "Possible mast lean / out of plumb"
    action_family: competent_closer_inspection
    action: "Measure verticality with a plumb or theodolite under the applicable instructions"
    limitations: "Single photo, 2D angle only; lean along the camera axis is not visible; screening, not measurement"
    priority: review
    route: {primary: "OHE coordinator", contributors: ["Civil / foundations"]}
  - id: R-SCN-01
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: scene_foreign_object
    observed: "A loose article is visible in the photo (see the inventory label)"
    hypothesis: "Foreign object near track or OHE"
    action_family: planned_maintenance
    action: "Check on site; remove if it can foul the OHE or track"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: review
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-SCN-02
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: loose_stone
    observed: "Stones or boulders are visible outside normal ballast"
    hypothesis: "Loose stone / boulder that may roll onto the track"
    action_family: planned_maintenance
    action: "Check on site and clear if it can foul the track"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: routine
    route: {primary: "P.Way supervisor", contributors: []}
  - id: R-SCN-03
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: scrap_metal
    observed: "Scrap metal, rods, pipes or wire coils are visible"
    hypothesis: "Metal debris that can foul the track or be blown onto the OHE"
    action_family: planned_maintenance
    action: "Clear the material; check for theft or left-over work material"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: review
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-SCN-04
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: animal_near_track
    observed: "An animal is visible near the track"
    hypothesis: "Animal near the track"
    action_family: planned_maintenance
    action: "Inform the station / caution as per local instructions"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: review
    route: {primary: "Station / section controller", contributors: []}
  - id: R-SCN-05
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: branch_near_ohe
    observed: "A tree branch is visible in the photo"
    hypothesis: "Branch that may fall on or grow towards the OHE"
    action_family: planned_maintenance
    action: "Check clearance on site; plan trimming"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: routine
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-SCN-06
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: creeper_on_structure
    observed: "Creeper vegetation is visible"
    hypothesis: "Creeper climbing a structure"
    action_family: planned_maintenance
    action: "Plan removal before it reaches live equipment"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: routine
    route: {primary: "OHE coordinator", contributors: []}
  - id: R-SCN-07
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: fire_or_smoke
    observed: "Fire or smoke is visible"
    hypothesis: "Fire or smoke near the track or OHE"
    action_family: planned_maintenance
    action: "Inform TPC and the station immediately"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: urgent
    route: {primary: "TPC", contributors: []}
  - id: R-SCN-08
    authority: "HLD §7 visual screening, open-vocabulary scene model (not validated on railway photos; clause to be confirmed by TRD)"
    decision_type: visual_screening
    condition: waterlogging
    observed: "Standing water is visible"
    hypothesis: "Waterlogging near track or foundations"
    action_family: planned_maintenance
    action: "Check drainage and foundation condition"
    limitations: "Open-vocabulary model: names what it sees in plain words; a person must confirm"
    priority: routine
    route: {primary: "P.Way supervisor", contributors: []}
mast_lean_screen_deg: 3.0   # screening angle after phone-roll correction (configurable; not a code tolerance)
unresolved_owner_queue: "OHE coordination queue"
