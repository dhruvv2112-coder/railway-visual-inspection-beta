name: release
# Beta handover bundle: server image (with the newest trained OHE detector) on GHCR + a GitHub pre-release holding the
# debug APK, the model files, docker-compose.yml, .env.example, add_user.sh and demo.py.
on:
  workflow_dispatch:
    inputs:
      tag: {description: "Release tag (default beta-<date>-<sha>)", default: ""}
permissions:
  contents: write
  packages: write
concurrency: {group: release, cancel-in-progress: false}
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Newest trained detector (full-data run if finished, else the latest CPU run)
        run: |
          set -e
          for b in ci-ohe-train-long ci-ohe-train; do
            if git fetch -q --depth 1 origin $b 2>/dev/null && git cat-file -e FETCH_HEAD:reports/ohe_detector.onnx 2>/dev/null; then
              git show FETCH_HEAD:reports/ohe_detector.onnx > deploy/models/ohe_detector.onnx
              git show FETCH_HEAD:reports/ohe_detector.names.json > deploy/models/ohe_detector.names.json
              git show FETCH_HEAD:reports/ohe_detector.json > deploy/models/ohe_detector.report.json 2>/dev/null || true
              echo "MODEL_SOURCE=$b@$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"; echo "model from $b"; break
            fi
          done
          if git fetch -q --depth 1 origin ci-ohe-assess 2>/dev/null && git cat-file -e FETCH_HEAD:reports/ohe_assess.onnx 2>/dev/null; then
            git show FETCH_HEAD:reports/ohe_assess.onnx > deploy/models/ohe_assess.onnx
            git show FETCH_HEAD:reports/ohe_assess.json > deploy/models/ohe_assess.json
          fi
          ls -la deploy/models
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rvi-ohe-server:latest
            ghcr.io/${{ github.repository_owner }}/rvi-ohe-server:${{ github.sha }}
      - name: Smoke test the image (health, OCR and detector loaded, demo flow in header mode)
        run: |
          set -eo pipefail
          docker run -d --name rvi -p 8000:8000 -e RVI_AUTH_MODE=header -e RVI_SECRET_KEY=ci ghcr.io/${{ github.repository_owner }}/rvi-ohe-server:${{ github.sha }}
          for i in $(seq 1 45); do curl -sf localhost:8000/health >/dev/null && break; sleep 2; done
          curl -sf localhost:8000/health | tee health.json || { docker logs rvi; exit 1; }
          grep -q '"ohe_ocr":"rapidocr' health.json
          python3 deploy/demo.py --server http://localhost:8000 --synthetic 2 | tee demo.log
          docker logs rvi | tail -20
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug && cp app/build/outputs/apk/debug/*.apk ../RVI-OHE-Patrol-debug.apk
      - name: Create pre-release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          TAG="${{ github.event.inputs.tag }}"; [ -z "$TAG" ] && TAG="beta-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)"
          cat > notes.md <<NOTES
          OHE Visual AI Patrol – Beta build.
          - Server image: ghcr.io/${{ github.repository_owner }}/rvi-ohe-server:${{ github.sha }} (also :latest)
          - Detector: ${MODEL_SOURCE:-none found}
          - Phone app: RVI-OHE-Patrol-debug.apk (install on Android 8+; set the server address on the home screen)
          - Set up: docs/HANDOVER.md
          Smoke test: $(cat health.json)
          NOTES
          for i in 1 2 3; do
            gh release create "$TAG" --prerelease --title "$TAG" --notes-file notes.md \
              RVI-OHE-Patrol-debug.apk deploy/docker-compose.yml deploy/.env.example deploy/add_user.sh deploy/demo.py \
              deploy/models/ohe_detector.onnx deploy/models/ohe_detector.names.json && break
            gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true; sleep 20
          done
          gh release view "$TAG" >/dev/null
