name: backend
on:
  push: {paths: ["backend/**", "shared/**", ".github/workflows/backend.yml"]}
  pull_request: {paths: ["backend/**", "shared/**"]}
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q --junitxml=../reports/backend-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-report, path: reports/backend-tests.xml}
