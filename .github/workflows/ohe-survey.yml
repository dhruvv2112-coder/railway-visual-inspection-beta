name: ohe-survey
# Dataset survey for the missing OHE classes: platform searches + file lists, no large downloads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ml/ohe/survey_sources.py", ".github/workflows/ohe-survey.yml"]
permissions:
  contents: write
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install huggingface_hub
      - name: Survey
        env: {GH_TOKEN: "${{ github.token }}", RVI_REPORTS: "${{ github.workspace }}/reports", HF_HUB_DISABLE_PROGRESS_BARS: "1"}
        run: python ml/ohe/survey_sources.py 2>&1 | tee survey.log
      - name: Publish to branch ci-ohe-survey
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r reports survey.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b ci-ohe-survey && echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "survey ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-ohe-survey
