name: ohe-train-resume
# Continue a detector training from the saved state of an earlier ohe-train-long / ohe-train-resume run (no data
# preparation), in up to 9 chained ~5-hour segments, then publish to the results branch.
on:
  workflow_dispatch:
    inputs:
      from_run: {description: "Run id whose 'state' artifact holds the dataset and resume.pt", required: true}
      budget: {description: "Training minutes per job (a segment never starts an epoch it cannot finish)", default: "285"}
      out_branch: {description: "Results branch", default: "ci-ohe-train-v2"}
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
env:
  OHE_DATA: ${{ github.workspace }}/.cache/ohe
  OHE_TIME_BUDGET_MIN: ${{ inputs.budget }}
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
jobs:
  train1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      paused: ${{ steps.t.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: ml/ohe/requirements.txt}
      - run: pip install -r ml/ohe/requirements.txt fastapi sqlmodel pydantic-settings python-multipart
      - uses: actions/download-artifact@v4
        with: {name: state, path: "${{ github.workspace }}", run-id: "${{ inputs.from_run }}", github-token: "${{ github.token }}"}
      - id: t
        name: Train segment 1
        working-directory: ml/ohe
        env: {OHE_RESUME: "1"}
        run: |
          mkdir -p ../../logs ../../reports; ls "$OHE_DATA/ohe_yolo" | head
          python train_detector.py 2>&1 | tee ../../logs/detector_r1.log
          if [ -f "$OHE_DATA/ohe_yolo/runs/det/PAUSED" ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; else echo "paused=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: state, path: "${{ github.workspace }}/.cache/ohe/ohe_yolo\n${{ github.workspace }}/reports\n${{ github.workspace }}/logs", compression-level: 0, retention-days: 5, overwrite: true, include-hidden-files: true}
  train2:
    needs: [train1]
    if: needs.train1.outputs.paused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      paused: ${{ steps.t.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: ml/ohe/requirements.txt}
      - run: pip install -r ml/ohe/requirements.txt fastapi sqlmodel pydantic-settings python-multipart
      - uses: actions/download-artifact@v4
        with: {name: state, path: "${{ github.workspace }}"}
      - id: t
        name: Train segment 2
        working-directory: ml/ohe
        env: {OHE_RESUME: "1"}
        run: |
          mkdir -p ../../logs ../../reports; ls "$OHE_DATA/ohe_yolo" | head
          python train_detector.py 2>&1 | tee ../../logs/detector_r2.log
          if [ -f "$OHE_DATA/ohe_yolo/runs/det/PAUSED" ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; else echo "paused=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: state, path: "${{ github.workspace }}/.cache/ohe/ohe_yolo\n${{ github.workspace }}/reports\n${{ github.workspace }}/logs", compression-level: 0, retention-days: 5, overwrite: true, include-hidden-files: true}
  train3:
    needs: [train2]
    if: needs.train2.outputs.paused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
