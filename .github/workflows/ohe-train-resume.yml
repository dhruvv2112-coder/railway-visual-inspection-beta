  publish:
    needs: [train1, train2, train3, train4, train5, train6, train7, train8, train9]
    if: always() && needs.train1.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: ml/ohe/requirements.txt}
