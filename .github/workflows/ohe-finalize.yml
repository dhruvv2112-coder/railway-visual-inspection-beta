name: ohe-finalize
# Test + export a finished training from its saved state (best.pt), publish to the results branch.
on:
  workflow_dispatch:
    inputs:
      state_run: {description: "Run id whose 'state' artifact holds the finished training", required: true}
      out_branch: {description: "Results branch", default: "ci-ohe-train-v2"}
      epochs: {description: "Epochs the run trained (for the report title)", default: "25"}
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
env:
  OHE_DATA: ${{ github.workspace }}/.cache/ohe
  RVI_REPORTS: ${{ github.workspace }}/reports
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  OHE_EPOCHS: ${{ inputs.epochs }}
  OHE_FINALIZE_ONLY: "1"
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: ml/ohe/requirements.txt}
      - run: pip install -r ml/ohe/requirements.txt fastapi sqlmodel pydantic-settings python-multipart
      - uses: actions/download-artifact@v4
        with: {name: state, path: "${{ github.workspace }}", run-id: "${{ inputs.state_run }}", github-token: "${{ github.token }}"}
      - name: Test and export from best.pt
        working-directory: ml/ohe
        run: |
          ls "$OHE_DATA/ohe_yolo/runs/det/weights/"; mkdir -p ../../reports ../../logs
          python train_detector.py 2>&1 | tee ../../logs/finalize.log
          python verify_onnx.py ../../reports "$OHE_DATA/ohe_yolo" 2>&1 | tee ../../logs/verify_onnx.log
      - name: Publish results branch
        run: |
          mkdir -p /tmp/pub && cp -r logs reports /tmp/pub/
          cp .cache/ohe/ohe_yolo/manifest.json .cache/ohe/ohe_yolo/runs/det/progress.json .cache/ohe/ohe_yolo/runs/det/results.csv /tmp/pub/reports/ 2>/dev/null || true
          cp .cache/ohe/ohe_yolo/runs/det/weights/best.pt /tmp/pub/reports/ohe_detector_best.pt
          cd /tmp/pub && git init -q -b "${{ inputs.out_branch }}"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "finalized from run ${{ inputs.state_run }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:${{ inputs.out_branch }}"
