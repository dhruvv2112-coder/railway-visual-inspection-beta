name: android
on:
  push: {paths: ["android/**", "shared/**", ".github/workflows/android.yml"]}
  pull_request: {paths: ["android/**"]}
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Build, unit tests, lint, screenshot capture
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
