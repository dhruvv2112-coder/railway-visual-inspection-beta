name: android
on:
  push: {paths: ["android/**", "shared/**", ".github/workflows/android.yml"]}
  pull_request: {paths: ["android/**"]}
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1"}
      - name: Build, unit tests, lint, screenshot capture
        working-directory: android
        run: mkdir -p ../logs && gradle --no-daemon --continue :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:recordRoborazziDebug 2>&1 | tee ../logs/gradle.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/roborazzi/
      - name: Publish logs and results to branch ci-android
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r logs android/app/build/reports android/app/build/test-results android/app/build/outputs/roborazzi /tmp/pub/ 2>/dev/null || true
          cd /tmp && rm -rf pubrepo && git clone -q --depth 1 --branch ci-android "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pubrepo 2>/dev/null || (mkdir pubrepo && cd pubrepo && git init -q -b ci-android && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}")
          cd /tmp/pubrepo && rm -rf ./* && cp -r /tmp/pub/* . 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "results ${{ github.sha }}" && git push -q -f origin HEAD:ci-android

  beta:
    # Every push to main that changes the app: signed, numbered Beta build -> rolling pre-release 'android-beta'
    # (latest.json + APK). Servers with RVI_GITHUB_TOKEN sync it and phones show "Update available".
    # Needs the repository secrets ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD (workflow android-signing-key).
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: {group: android-beta, cancel-in-progress: false}
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - name: Signing key missing
        if: env.HAS_KEY != 'true'
        run: echo "::warning::No ANDROID_KEYSTORE_B64 secret – Beta not published. Run the android-signing-key workflow once."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
        with: {gradle-version: "8.11.1"}
      - name: Build signed Beta
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/beta.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/beta.jks"
          export RVI_VERSION_CODE=$((1000 + ${{ github.run_number }})) RVI_VERSION_NAME="0.2.$((1000 + ${{ github.run_number }}))"
          echo "VCODE=$RVI_VERSION_CODE" >> "$GITHUB_ENV"; echo "VNAME=$RVI_VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleBeta
          cp app/build/outputs/apk/beta/*.apk "../RVI-OHE-Patrol-$RVI_VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/beta.jks"
      - name: Release manifest and notes
        if: env.HAS_KEY == 'true'
        run: |
          APK="RVI-OHE-Patrol-$VNAME.apk"
          PREV=$(git rev-list -n 1 android-beta 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-15"; fi
          git log --no-merges --format='%s' $RANGE -- android shared | grep -v 'skip ci' | head -12 > notes.txt || true
          python3 .github/scripts/app_manifest.py "$APK" notes.txt > latest.json
          { echo "Android Beta $VNAME (commit ${GITHUB_SHA::7})"; echo; sed 's/^/- /' notes.txt; } > notes.md
          cat latest.json
      - name: Publish rolling pre-release android-beta
        if: env.HAS_KEY == 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release delete android-beta -y --cleanup-tag 2>/dev/null || true
          for i in 1 2 3; do
            gh release create android-beta --prerelease --target "$GITHUB_SHA" --title "Android Beta $VNAME" --notes-file notes.md \
              "RVI-OHE-Patrol-$VNAME.apk" latest.json && break
            sleep 15
          done
          gh release view android-beta --json assets -q '.assets[].name'
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: {name: "android-beta-${{ env.VNAME }}", path: "RVI-OHE-Patrol-*.apk", retention-days: 90}
