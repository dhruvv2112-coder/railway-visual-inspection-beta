name: ohe-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ml/ohe/probe_sources.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install huggingface_hub
      - run: python ml/ohe/probe_sources.py
