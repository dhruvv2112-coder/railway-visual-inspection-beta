name: ohe-assess
# Photo-angle (perspective) check: EPDCL perspective_validation → MobileNetV3-small → ONNX. Results: branch ci-ohe-assess.
on:
  workflow_dispatch:
    inputs:
      epochs: {description: "Epochs", default: "8"}
permissions:
  contents: write
env:
  OHE_DATA: ${{ github.workspace }}/.cache/ohe
  RVI_REPORTS: ${{ github.workspace }}/reports
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: ml/ohe/requirements.txt}
      - run: pip install -r ml/ohe/requirements.txt
      - name: Train
        working-directory: ml/ohe
        env: {OHE_ASSESS_EPOCHS: "${{ github.event.inputs.epochs || '8' }}"}
        run: mkdir -p ../../logs && python assess.py 2>&1 | tee ../../logs/assess.log
      - name: Publish to branch ci-ohe-assess
        if: always()
        run: |
          mkdir -p /tmp/pub && cp -r logs reports /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q -b ci-ohe-assess && echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "assess ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:ci-ohe-assess
